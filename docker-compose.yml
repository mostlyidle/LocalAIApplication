# =============================================================================
# Docker Compose — Local AI Application
# =============================================================================
# Profiles:
#   - infra:   Infrastructure (Ollama + Qdrant + Chroma migration source)
#   - app:     Backend + Frontend (requires infra or native services)
#   - full:    Everything together
#   - observability: Optional Prometheus + Grafana
#
# Usage:
#   make docker-infra    # Start only Ollama + ChromaDB
#   make docker-up       # Start all services
#   make docker-down     # Stop all services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure services
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: local-ai-ollama
    profiles: ["infra", "full"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # On Apple Silicon, native Ollama is recommended for Metal acceleration.
    # This container uses CPU-only inference.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  chromadb:
    image: chromadb/chroma:latest
    container_name: local-ai-chromadb
    profiles: ["infra", "full"]
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: local-ai-qdrant
    profiles: ["infra", "app", "full"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: local-ai-prometheus
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: local-ai-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-before-production}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: local-ai-backend
    profiles: ["app", "full"]
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      QDRANT_URL: http://qdrant:6333
      FASTEMBED_CACHE_PATH: /app/data/fastembed
      AGENT_WORKSPACE_ROOT: /workspace
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
    volumes:
      - backend_data:/app/data
      - ${AGENT_WORKSPACE_HOST_PATH:-./workspace}:/workspace:ro
    depends_on:
      ollama:
        condition: service_healthy
        required: false
      chromadb:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_started
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: local-ai-frontend
    profiles: ["app", "full"]
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ollama_data:
  chroma_data:
  qdrant_data:
  backend_data:
  prometheus_data:
  grafana_data:
