[package]
name = "local-ai-desktop"
version = "0.1.0"
description = "Native desktop host for Local AI Application"
authors = ["Local AI Application"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "local_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2", features = [] }
parking_lot = "0.12"
tungstenite = "0.28"
url = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=8.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.16"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
