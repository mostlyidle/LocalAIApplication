# Alembic configuration for Local AI Application
# Runs against the *application* database (chat history, documents metadata).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

# Synchronous URL used by Alembic's migration runner.
# Overridden dynamically in env.py from app.config.settings.
sqlalchemy.url = sqlite:///./data/app.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
