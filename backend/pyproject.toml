[project]
name = "local-ai-backend"
version = "0.1.0"
description = "Local AI Application — FastAPI backend with LangGraph agents, MCP servers, and document intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "fastembed==0.8.0",

    # LLM & Agents
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "jinja2>=3.1.0,<4",

    # MCP
    "mcp[cli]>=1.0.0",

    # Vector store
    "chromadb>=0.5.0",
    "qdrant-client>=1.19.1,<1.20",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",

    # Document parsing
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=2.3.1,<3",
    "markdown>=3.7",

    # OCR
    "easyocr>=1.7.0",

    # Local speech-to-text
    "faster-whisper>=1.1.0",

    # SQL parsing & validation
    "sqlglot>=30.22.0,<31",

    # Configuration
    "pydantic-settings>=2.6.0",

    # Logging
    "structlog>=24.0.0",

    # File type detection
    "python-magic>=0.4.27",

    # Rate limiting
    "slowapi>=0.1.9",

    # HTTP client (for web tools & Ollama health checks)
    "httpx>=0.27.0",

    # Utilities
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]
mlx = [
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]
documents = [
    "docling>=2.95.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
